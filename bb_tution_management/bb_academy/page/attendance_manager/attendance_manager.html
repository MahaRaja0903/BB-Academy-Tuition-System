<div class="attendance-manager">

    <!-- Control panel -->
    <div class="att-panel">
        <div class="att-panel-filters">
            <div class="att-field att-field-standard">
                <label for="att-standard"><i class="fa fa-graduation-cap"></i> Standard</label>
                <select id="att-standard" class="form-control">
                    <option value="">Select Standard</option>
                </select>
            </div>
            <div class="att-field att-field-batch">
                <label for="att-batch"><i class="fa fa-users"></i> Batch</label>
                <select id="att-batch" class="form-control" disabled>
                    <option value="">Select Batch</option>
                </select>
            </div>
            <div class="att-field att-field-gender">
                <label for="att-gender"><i class="fa fa-venus-mars"></i> Gender</label>
                <select id="att-gender" class="form-control">
                    <option value="">All</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
        </div>

        <div class="att-panel-date">
            <span class="att-date-label"><i class="fa fa-calendar"></i> Attendance Date</span>
            <div class="att-date-stepper">
                <button type="button" class="att-date-nav-btn" id="btn-prev-day" title="Previous Day"><i class="fa fa-arrow-left"></i></button>
                <input type="date" id="att-date" class="att-date-input">
                <button type="button" class="att-date-nav-btn" id="btn-next-day" title="Next Day"><i class="fa fa-arrow-right"></i></button>
            </div>
        </div>

        <div class="att-panel-actions">
            <button class="att-holiday-btn" id="btn-assign-holiday">
                <i class="fa fa-calendar-plus-o"></i> <span>Assign Holiday</span>
            </button>
        </div>
    </div>

    <!-- KPI cards -->
    <div class="att-kpi-grid" id="att-kpi-grid">
        <button type="button" class="att-kpi-card att-kpi-total" data-filter="total" title="Show all students">
            <span class="att-kpi-icon"><i class="fa fa-users"></i></span>
            <span class="att-kpi-body">
                <span class="att-kpi-value" id="sum-total">0</span>
                <span class="att-kpi-label">Total Students</span>
            </span>
        </button>
        <button type="button" class="att-kpi-card att-kpi-present" data-filter="present" title="Show present students">
            <span class="att-kpi-icon"><i class="fa fa-check-circle"></i></span>
            <span class="att-kpi-body">
                <span class="att-kpi-value" id="sum-present">0</span>
                <span class="att-kpi-label">Present</span>
            </span>
        </button>
        <button type="button" class="att-kpi-card att-kpi-absent" data-filter="absent" title="Show absent students">
            <span class="att-kpi-icon"><i class="fa fa-times-circle"></i></span>
            <span class="att-kpi-body">
                <span class="att-kpi-value" id="sum-absent">0</span>
                <span class="att-kpi-label">Absent</span>
            </span>
        </button>
        <button type="button" class="att-kpi-card att-kpi-late" data-filter="late" title="Show late students">
            <span class="att-kpi-icon"><i class="fa fa-clock-o"></i></span>
            <span class="att-kpi-body">
                <span class="att-kpi-value" id="sum-late">0</span>
                <span class="att-kpi-label">Late</span>
            </span>
        </button>
        <button type="button" class="att-kpi-card att-kpi-pending" data-filter="pending" title="Show pending students">
            <span class="att-kpi-icon"><i class="fa fa-hourglass-half"></i></span>
            <span class="att-kpi-body">
                <span class="att-kpi-value" id="sum-pending">0</span>
                <span class="att-kpi-label">Pending</span>
            </span>
        </button>
    </div>

    <!-- Toolbar -->
    <div class="att-toolbar">
        <div class="att-search-wrap">
            <i class="fa fa-search"></i>
            <input type="text" id="att-search" class="att-search-input" placeholder="Search student name or ID">
        </div>
        <div class="att-toolbar-right">
            <span class="att-filter-chip" id="att-filter-chip" style="display:none;">
                <span>Showing <strong id="att-filter-chip-label"></strong></span>
                <button type="button" id="att-filter-chip-clear" title="Clear filter"><i class="fa fa-times"></i></button>
            </span>
            <div class="custom-control custom-switch att-show-completed-switch">
                <input type="checkbox" class="custom-control-input" id="att-show-completed">
                <label class="custom-control-label" for="att-show-completed">Show Completed</label>
            </div>
        </div>
    </div>

    <!-- Bulk selection action bar -->
    <div id="att-bulk-bar" class="att-bulk-bar" style="display: none;">
        <span class="att-bulk-count"><i class="fa fa-check-square-o"></i> <span id="bulk-count">0</span> Students Selected</span>
        <div class="att-bulk-actions">
            <button class="att-bulk-btn att-bulk-present" id="bulk-mark-present"><i class="fa fa-check"></i> Present</button>
            <button class="att-bulk-btn att-bulk-absent" id="bulk-mark-absent"><i class="fa fa-times"></i> Absent</button>
            <button class="att-bulk-btn att-bulk-late" id="bulk-mark-late"><i class="fa fa-clock-o"></i> Late</button>
            <button class="att-bulk-btn att-bulk-clear" id="bulk-clear-selection">Clear</button>
        </div>
    </div>

    <!-- Holiday card -->
    <div id="holiday-message" class="att-holiday-card" style="display: none;">
        <div class="att-holiday-icon"><i class="fa fa-calendar-plus-o"></i></div>
        <div class="att-holiday-content">
            <h4>Holiday</h4>
            <p><span class="att-holiday-key">Type</span><span id="hol-type"></span></p>
            <p><span class="att-holiday-key">Reason</span><span id="hol-reason"></span></p>
            <p class="att-holiday-note">Attendance is not required for this date.</p>
        </div>
    </div>

    <!-- Student table / cards -->
    <div class="att-table-card">
        <div class="table-responsive att-table-scroll">
            <table class="att-table" id="att-table">
                <thead>
                    <tr>
                        <th class="att-col-select"><input type="checkbox" id="att-select-all" title="Select all"></th>
                        <th class="att-col-id">Student ID &amp; Stats</th>
                        <th class="att-col-name">Student Name</th>
                        <th class="att-col-prev">Previous Day</th>
                        <th class="att-col-actions">Today&apos;s Attendance</th>
                    </tr>
                </thead>
                <tbody id="att-tbody">
                    <tr class="att-placeholder-row"><td colspan="5">
                        <div class="att-empty-state">
                            <div class="att-empty-icon"><i class="fa fa-graduation-cap"></i></div>
                            <h4>Select Standard &amp; Batch</h4>
                            <p>Choose a Standard and Batch above to load students and start marking attendance.</p>
                        </div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<template id="att-row-template">
    <tr class="att-student-row" data-id="${student_id}" data-name="${student_name_lower}" data-current-status="${today_status_raw}">
        <td class="att-td-select">
            <input type="checkbox" class="att-row-select" data-id="${student_id}">
        </td>
        <td class="att-td-id">
            <div class="att-student-id">${student_id}</div>
            <div class="att-student-stats">
                <span class="att-stat-chip att-stat-absent">Absent <b class="att-absent-count">${monthly_absent}</b></span>
                <span class="att-stat-chip att-stat-late">Late <b class="att-late-count">${monthly_late}</b></span>
            </div>
        </td>
        <td class="att-td-name">
            <span class="att-student-name">${student_name}</span>
            <i class="fa ${gender_icon} att-gender-icon ${gender_icon_class}" title="${gender}"></i>
        </td>
        <td class="att-td-prev">
            <span class="att-prev-label">Previous</span>
            <span class="att-prev-badge" data-status="${previous_status}">${previous_status}</span>
        </td>
        <td class="att-td-actions">
            <div class="att-status-group" data-toggle="buttons">
                <label class="btn att-status-btn att-status-present ${present_active}">
                    <input type="radio" name="att_${student_id}" value="Present" autocomplete="off" ${present_checked}>
                    <i class="fa fa-check-circle"></i><span>Present</span>
                </label>
                <label class="btn att-status-btn att-status-absent ${absent_active}">
                    <input type="radio" name="att_${student_id}" value="Absent" autocomplete="off" ${absent_checked}>
                    <i class="fa fa-times-circle"></i><span>Absent</span>
                </label>
                <label class="btn att-status-btn att-status-late ${late_active}">
                    <input type="radio" name="att_${student_id}" value="Late" autocomplete="off" ${late_checked}>
                    <i class="fa fa-clock-o"></i><span>Late</span>
                </label>
            </div>
        </td>
    </tr>
</template>
