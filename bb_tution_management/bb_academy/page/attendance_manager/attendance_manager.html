<div class="attendance-manager">
    <div class="row att-header">
        <div class="col-sm-3">
            <div class="form-group">
                <label>Standard</label>
                <select id="att-standard" class="form-control">
                    <option value="">Select Standard</option>
                </select>
            </div>
        </div>
        <div class="col-sm-3">
            <div class="form-group">
                <label>Batch</label>
                <select id="att-batch" class="form-control" disabled>
                    <option value="">Select Batch</option>
                </select>
            </div>
        </div>
        <div class="col-sm-4 text-center">
            <div class="form-group">
                <label>Date</label>
                <div class="d-flex align-items-center justify-content-center">
                    <button class="btn btn-default btn-sm mr-2" id="btn-prev-day"><i class="fa fa-arrow-left"></i></button>
                    <input type="date" id="att-date" class="form-control" style="width: auto; display: inline-block;">
                    <button class="btn btn-default btn-sm ml-2" id="btn-next-day"><i class="fa fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
        <div class="col-sm-2 text-right">
            <label>&nbsp;</label><br>
            <button class="btn btn-secondary btn-sm" id="btn-assign-holiday">Assign Holiday</button>
        </div>
    </div>
    
    <div class="row summary-section mt-3 mb-3">
        <div class="col-sm-12">
            <div class="d-flex flex-wrap justify-content-between align-items-center" style="background: #f8f9fa; padding: 15px; border-radius: 8px;">
                <div><strong>Total Students: </strong><span id="sum-total">0</span></div>
                <div class="text-success"><strong>Present: </strong><span id="sum-present">0</span></div>
                <div class="text-danger"><strong>Absent: </strong><span id="sum-absent">0</span></div>
                <div class="text-muted"><strong>Late: </strong><span id="sum-late">0</span></div>
                <div class="text-warning"><strong>Pending: </strong><span id="sum-pending">0</span></div>
                <div>
                    <input type="text" id="att-search" class="form-control form-control-sm" placeholder="Search Student..." style="width: 200px;">
                </div>
            </div>
        </div>
    </div>
    
    <div id="holiday-message" class="alert alert-info" style="display: none;">
        <h4><i class="fa fa-info-circle"></i> Holiday</h4>
        <p><strong>Type: </strong><span id="hol-type"></span></p>
        <p><strong>Reason: </strong><span id="hol-reason"></span></p>
        <p>Attendance is not required.</p>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover att-table" id="att-table">
            <thead>
                <tr>
                    <th style="width: 20%">Student ID & Stats</th>
                    <th style="width: 25%">Student Name</th>
                    <th style="width: 15%">Previous Day</th>
                    <th style="width: 40%">Today's Attendance</th>
                </tr>
            </thead>
            <tbody id="att-tbody">
                <tr><td colspan="4" class="text-center text-muted">Select Standard and Batch to load students.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<template id="att-row-template">
    <tr class="att-student-row" data-id="${student_id}" data-name="${student_name_lower}">
        <td>
            <strong>${student_id}</strong>
            <div class="small text-muted mt-1">
                <span class="mr-2">Absent: <span class="badge badge-danger text-white att-absent-count">${monthly_absent}</span></span>
                <span>Late: <span class="badge badge-secondary text-white att-late-count">${monthly_late}</span></span>
            </div>
        </td>
        <td class="align-middle">
            <span style="font-size: 1.1em">${student_name}</span>
        </td>
        <td class="align-middle text-muted">
            ${previous_status}
        </td>
        <td class="align-middle">
            <div class="btn-group btn-group-toggle d-flex w-100" data-toggle="buttons">
                <label class="btn btn-outline-success flex-fill att-status-btn ${present_active}">
                    <input type="radio" name="att_${student_id}" value="Present" autocomplete="off" ${present_checked}> ✓ Present
                </label>
                <label class="btn btn-outline-danger flex-fill att-status-btn ${absent_active}">
                    <input type="radio" name="att_${student_id}" value="Absent" autocomplete="off" ${absent_checked}> ✕ Absent
                </label>
                <label class="btn btn-outline-secondary flex-fill att-status-btn ${late_active}">
                    <input type="radio" name="att_${student_id}" value="Late" autocomplete="off" ${late_checked}> ◷ Late
                </label>
            </div>
        </td>
    </tr>
</template>
