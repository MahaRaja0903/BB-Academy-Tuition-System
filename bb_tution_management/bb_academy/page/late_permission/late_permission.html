<div class="lp-manager">
    <div class="lp-panel">
        <div class="lp-panel-filters">
            <div class="lp-field lp-field-type">
                <label for="lp-type"><i class="fa fa-tag"></i> Type</label>
                <select id="lp-type" class="form-control">
                    <option value="Late Permission" selected>Late Permission</option>
                    <option value="Early Out">Early Out</option>
                </select>
            </div>
            <div class="lp-field lp-field-standard">
                <label for="lp-standard"><i class="fa fa-graduation-cap"></i> Standard</label>
                <select id="lp-standard" class="form-control">
                    <option value="">Select Standard</option>
                </select>
            </div>
            <div class="lp-field lp-field-batch">
                <label for="lp-batch"><i class="fa fa-users"></i> Batch</label>
                <select id="lp-batch" class="form-control" disabled>
                    <option value="">Select Batch</option>
                </select>
            </div>
            <div class="lp-field lp-field-gender">
                <label for="lp-gender"><i class="fa fa-venus-mars"></i> Gender</label>
                <select id="lp-gender" class="form-control">
                    <option value="">All</option>
                    <option value="Boys">Boys</option>
                    <option value="Girls">Girls</option>
                </select>
            </div>
        </div>

        <div class="lp-panel-date">
            <span class="lp-date-label"><i class="fa fa-calendar"></i> Date</span>
            <div class="lp-date-stepper">
                <button type="button" class="lp-date-nav-btn" id="btn-prev-day" title="Previous Day"><i class="fa fa-arrow-left"></i></button>
                <input type="date" id="lp-date" class="lp-date-input">
                <button type="button" class="lp-date-nav-btn" id="btn-next-day" title="Next Day"><i class="fa fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="lp-toolbar">
        <div class="lp-search-wrap">
            <i class="fa fa-search"></i>
            <input type="text" id="lp-search" class="lp-search-input" placeholder="Search student name or ID">
        </div>
    </div>

    <div class="lp-table-card">
        <div class="table-responsive lp-table-scroll">
            <table class="lp-table" id="lp-table">
                <thead>
                    <tr>
                        <th class="lp-col-id">Student ID</th>
                        <th class="lp-col-name">Student Name</th>
                        <th class="lp-col-att-status">Attendance</th>
                        <th class="lp-col-status">Status</th>
                        <th class="lp-col-actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="lp-tbody">
                    <tr class="lp-placeholder-row"><td colspan="5">
                        <div class="lp-empty-state">
                            <div class="lp-empty-icon"><i class="fa fa-graduation-cap"></i></div>
                            <h4>Select Standard &amp; Batch</h4>
                            <p>Choose a Standard and Batch above to load students.</p>
                        </div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<template id="lp-row-template">
    <tr class="lp-student-row" data-id="${student_id}" data-name="${student_name_lower}" data-status="${has_permission}">
        <td class="lp-td-id">
            <div class="lp-student-id">${student_id}</div>
        </td>
        <td class="lp-td-name">
            <div class="lp-student-profile" style="display: flex; align-items: center; gap: 10px;">
                <div class="lp-student-name-wrap" style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px;">
                    <span class="lp-student-name">${student_name}</span>
                </div>
            </div>
        </td>
        <td class="lp-td-att-status">
            ${attendance_badge}
        </td>
        <td class="lp-td-status">
            ${status_badge}
        </td>
        <td class="lp-td-actions">
            ${action_button}
        </td>
    </tr>
</template>
